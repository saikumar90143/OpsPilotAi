name: OpsPilot AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pip-audit
      - name: Lint & format check
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app --ignore-missing-imports
      - name: Migration roundtrip check
        run: |
          DATABASE_URL=sqlite:///./ci_mig.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_mig.db alembic downgrade base
          DATABASE_URL=sqlite:///./ci_mig.db alembic upgrade head
          rm -f ci_mig.db
      - name: Run unit/integration tests (SQLite)
        run: pytest -m "not postgres" -v
      - name: Run offline AI evaluation harness
        run: python -m app.evals.runner --output /tmp/eval_report.json
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript, ESLint, Vitest & Next build
        run: |
          npm run typecheck
          npm run lint
          npm run test
          npm run build
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend Docker image build
        run: docker build -t opspilot-api:ci ./backend
      - name: Validate frontend Docker image build
        run: docker build -t opspilot-frontend:ci ./frontend
