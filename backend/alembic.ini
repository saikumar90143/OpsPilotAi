# Alembic configuration.
# The database URL is NOT stored here. env.py reads it from app settings
# (DATABASE_URL env var / .env), or from config.attributes["database_url"] in tests.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
